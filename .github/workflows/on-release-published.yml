name: Publish release JARs and Docker images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # matcher's dex-ext build (project/NodeArtifactsPlugin.scala) downloads a
  # `dcc-grpc-server-<version>.tgz` (and a `dcc-grpc-server-stagenet-<version>.tgz`)
  # release asset from this repo's GitHub Releases API to build its own Docker
  # image -- confirmed missing entirely on this repo's first real release
  # ("Can't find the grpc-server archive"), since nothing had ever uploaded it.
  # This repo doesn't build network-differentiated Universal tarballs (that's
  # only done for Debian packages), so both expected names get the same content.
  publish-grpc-server-tarball:
    name: Upload grpc-server tarball (matcher dex-ext dependency)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # gh release upload
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - run: sbt --batch 'grpc-server/Universal/packageZipTarball'
      - name: Upload tarball under both names matcher's build expects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tgz=$(find grpc-server/target/universal -maxdepth 1 -name 'dcc-grpc-server-*.tgz')
          version="${{ github.ref_name }}"
          version="${version#v}"
          cp "$tgz" "dcc-grpc-server-stagenet-${version}.tgz"
          gh release upload "${{ github.ref_name }}" "$tgz" "dcc-grpc-server-stagenet-${version}.tgz" --repo "${{ github.repository }}"

  publish-node-image:
    name: Publish DCC Node Image
    uses: ./.github/workflows/publish-node-scala.yml
    with:
      raw-docker-tags: |
        type=match,pattern=v(.*),group=1
        type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      environment: Docker Hub
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-ride-runner-image:
    name: Publish RIDE Runner to Docker Hub
    environment: Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - run: sbt --batch 'buildRIDERunnerForDocker'
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The image is pushed to ghcr.io (not Docker Hub, despite this job's
      # name/login above) but there was no ghcr.io login at all -- push
      # failed with "failed to fetch anonymous token: 403 Forbidden" on the
      # very first real release. GITHUB_TOKEN + this job's packages:write
      # permission is all ghcr.io needs.
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-ride-runner
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/decentral-america/ride-runner
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ./ride-runner/docker
          push: ${{ github.event_name == 'release' }}
          pull: true
          tags: ${{ steps.meta-ride-runner.outputs.tags }}

  publish-release-jars:
    environment: prod
    name: Publish JARs to Sonatype
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: sbt-version
        run: |
          set -euo pipefail
          # version.sbt has a `//` comment line between the two `:=` lines; a
          # blind `cut -d\" -f2` over the whole file also matches (empty) on
          # that comment line, producing a multi-line value that corrupts
          # $GITHUB_OUTPUT ("Unable to process file command 'output'").
          # Extract only the `ThisBuild / version` line specifically.
          sbt_version=$(grep '^ThisBuild / version' version.sbt | cut -d\" -f2)
          echo "sbt_version=$sbt_version" >> "$GITHUB_OUTPUT"
      - if: format('v{0}', steps.sbt-version.outputs.sbt_version) != github.ref_name
        env:
          SBT_VERSION: ${{ steps.sbt-version.outputs.sbt_version }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::error::Release version $RELEASE_VERSION does not match SBT version $SBT_VERSION"
          exit 1
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Publish release jars
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sbt --batch ";publishSigned;sonaRelease"

