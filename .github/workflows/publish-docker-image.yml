name: Publish Docker image
run-name: Publish ref ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      docker-tags:
        description: 'Docker tags'
        required: true
      base-image:
        description: 'Base image'
        required: false
      publish-private-node:
        description: 'Publish private node'
        type: boolean
        default: false
  workflow_call:
    inputs:
      raw-docker-tags:
        type: string
      environment:
        type: string
      ref:
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

env:
  IMAGE_NAME: ghcr.io/decentral-america/node-scala
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      node-version: ${{ steps.versions.outputs.node-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/sdk/protobuf-serialization
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc  # v0.1.0
      - uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45  # v2.2.0
        id: ghd
        with:
          commit-ish: ${{ inputs.ref || github.sha}}
      - name: Prepare base image and node version
        run: |
          BASE_IMAGE=${{ inputs.base-image }}
          BASE_IMAGE=${BASE_IMAGE:-$(grep '^ARG baseImage=' docker/Dockerfile | cut -d= -f2-)}
          echo "base-image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "base-image-digest=$(regctl manifest digest $BASE_IMAGE)" >> "$GITHUB_OUTPUT"
          echo "node-version=$(echo ${{ steps.ghd.outputs.describe }} | cut -c 2-)" >> "$GITHUB_OUTPUT"
        id: versions
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Install Rust stable (for groth16 JNI native lib)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          workspaces: _dcc-monorepo/packages/jvm/groth16
      - name: Build groth16_jni native library (linux/amd64)
        working-directory: _dcc-monorepo/packages/jvm/groth16/groth16_jni
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Stage groth16 native lib into Maven resources
        run: |
          mkdir -p _dcc-monorepo/packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64
          cp _dcc-monorepo/packages/jvm/groth16/target/x86_64-unknown-linux-gnu/release/libgroth16_jni.so \
             _dcc-monorepo/packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-serialization && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
      - name: Build tarballs for docker
        run: sbt --batch -Dproject.version=${{ steps.versions.outputs.node-version }} buildTarballsForDocker
      - name: Extract image name and tags from workflow_call inputs
        if: inputs.raw-docker-tags != ''
        env:
          RAW_DOCKER_TAGS: ${{ inputs.raw-docker-tags }}
        run: |
          echo "TAGS=$RAW_DOCKER_TAGS" >> "$GITHUB_ENV"
          {
            echo 'IMAGES<<EOF'
            echo ${{ env.IMAGE_NAME }}
            echo ghcr.io/decentral-america/node-scala
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Extract image name and tags from workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo 'TAGS<<EOF'
            echo ${{ inputs.docker-tags }} | tr ',' '\n' | sed -e 's/^/type=raw,value=/'
            echo EOF
          } >> "$GITHUB_ENV"
          echo "IMAGES=${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
      - name: Prepare annotations
        run: |
          {
            echo 'annotations<<EOF'
            echo org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ steps.ghd.outputs.sha }}/docker
            echo org.opencontainers.image.licenses=MIT
            echo org.opencontainers.image.description=DCC Node
            echo org.opencontainers.image.base.name=${{ steps.versions.outputs.base-image }}
            echo org.opencontainers.image.base.digest=${{ steps.versions.outputs.base-image-digest }}
            echo org.opencontainers.image.version=${{ steps.versions.outputs.node-version }}
            echo org.opencontainers.image.revision=${{ steps.ghd.outputs.sha }}
            echo EOF
          } >> "$GITHUB_OUTPUT"
        id: annotations
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        if: inputs.environment != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest-descriptor,index-descriptor
        with:
          images: ${{ env.IMAGES }}
          flavor: latest=${{ contains(inputs.docker-tags, 'latest') }}
          tags: ${{ env.TAGS }}
          annotations: ${{ steps.annotations.outputs.annotations }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        id: push
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: baseImage=${{ steps.versions.outputs.base-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name:     ${{ env.IMAGE_NAME }}
          subject-digest:   ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Prepare summary
        run: |
          {
            echo '## Image Info'
            echo '- This image: `${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}`'
            echo '- Base image: `${{ steps.versions.outputs.base-image }}@${{ steps.versions.outputs.base-image-digest }}`'
            echo '- Version: `${{ steps.versions.outputs.node-version }}`'
          } >> $GITHUB_STEP_SUMMARY
  publish-private-node:
    needs: [publish]
    name: Publish private node image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    if: ${{ inputs.publish-private-node }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - run: |
          {
            echo 'description<<EOF'
            cat docker/private/README.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
        id: description
      - run: |
          {
            echo 'TAGS<<EOF'
            echo ${{ inputs.docker-tags }} | tr ',' '\n' | sed -e 's/^/type=raw,value=/'
            echo EOF
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-private
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest-descriptor,index-descriptor
        with:
          images: ghcr.io/decentral-america/node-scala-private
          flavor: latest=false
          tags: ${{ env.TAGS }}
          annotations: |
            org.opencontainers.image.description=DCC Private Node
            org.opencontainers.image.documentation=https://github.com/Decentral-America/node-scala/blob/${{ github.sha }}/docker/README.md#dcc-private-node
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.publish.outputs.node-version }}
            org.opencontainers.image.base.digest=${{ needs.publish.outputs.digest }}
      - id: push-private
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          platforms: linux/amd64,linux/arm64
          context: ./docker/private
          push: true
          pull: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta-private.outputs.tags }}
          build-args: |
            baseImage=ghcr.io/decentral-america/node-scala@${{ needs.publish.outputs.digest }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name:   ghcr.io/decentral-america/node-scala-private
          subject-digest: ${{ steps.push-private.outputs.digest }}
          push-to-registry: true
      - name: Make package public (for cross-repo access)
        run: |
          gh api --method PATCH /orgs/Decentral-America/packages/container/node-scala-private \
            -f visibility=public || echo "::warning::Could not set package visibility to public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
