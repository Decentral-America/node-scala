name: Publish node-scala
run-name: Publish node-scala @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      docker-tags:
        description: 'Docker tags'
        required: true
      base-image:
        description: 'Base image'
        required: false
  workflow_call:
    inputs:
      raw-docker-tags:
        type: string
      environment:
        type: string
      ref:
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

concurrency:
  group: publish-node-scala-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/decentral-america/node-scala
  # Container-aware heap (70% of cgroup limit), G1GC for compilation throughput.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  publish:
    name: Build · Push · Attest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      node-version: ${{ steps.versions.outputs.node-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          persist-credentials: false
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/sdk/protobuf-schemas
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc  # v0.1.0
      - name: Get version from git describe
        id: ghd
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          DESCRIBE=$(git describe --tags --match 'v*' --long HEAD 2>/dev/null \
            || echo "v0.0.0-0-g$(git rev-parse --short HEAD)")
          echo "describe=$DESCRIBE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare base image and node version
        env:
          BASE_IMAGE_INPUT: ${{ inputs.base-image }}
        run: |
          set -euo pipefail
          BASE_IMAGE="${BASE_IMAGE_INPUT:-$(grep '^ARG baseImage=' docker/Dockerfile | cut -d= -f2-)}"
          echo "base-image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "base-image-digest=$(regctl manifest digest "$BASE_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "node-version=$(echo ${{ steps.ghd.outputs.describe }} | cut -c 2-)" >> "$GITHUB_OUTPUT"
        id: versions
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Install Rust stable (for groth16 JNI native lib)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: _dcc-monorepo/packages/jvm/groth16
      - name: Build groth16_jni native library (linux/amd64)
        working-directory: _dcc-monorepo/packages/jvm/groth16/groth16_jni
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Stage groth16 native lib into Maven resources
        run: |
          set -euo pipefail
          mkdir -p _dcc-monorepo/packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64
          cp _dcc-monorepo/packages/jvm/groth16/target/x86_64-unknown-linux-gnu/release/libgroth16_jni.so \
             _dcc-monorepo/packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          set -euo pipefail
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-schemas && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
      - name: Build tarballs for docker
        run: sbt --batch -Dproject.version=${{ steps.versions.outputs.node-version }} buildTarballsForDocker
      - name: Extract image name and tags from workflow_call inputs
        if: inputs.raw-docker-tags != ''
        env:
          RAW_DOCKER_TAGS: ${{ inputs.raw-docker-tags }}
        run: |
          {
            echo 'TAGS<<TAGS_EOF'
            printf '%s\n' "${RAW_DOCKER_TAGS}"
            echo 'TAGS_EOF'
          } >> "$GITHUB_ENV"
          {
            echo 'IMAGES<<EOF'
            echo ${{ env.IMAGE_NAME }}
            echo ghcr.io/decentral-america/node-scala
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Extract image name and tags from workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_DOCKER_TAGS: ${{ inputs.docker-tags }}
          IMAGE_NAME_ENV: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          {
            echo 'TAGS<<EOF'
            echo "${INPUT_DOCKER_TAGS}" | tr ',' '\n' | sed -e 's/^/type=raw,value=/'
            echo EOF
          } >> "$GITHUB_ENV"
          echo "IMAGES=${IMAGE_NAME_ENV}" >> "$GITHUB_ENV"
      - name: Prepare annotations
        run: |
          {
            echo 'annotations<<EOF'
            echo org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ steps.ghd.outputs.sha }}/docker
            echo org.opencontainers.image.licenses=MIT
            echo org.opencontainers.image.description=DCC Node
            echo org.opencontainers.image.base.name=${{ steps.versions.outputs.base-image }}
            echo org.opencontainers.image.base.digest=${{ steps.versions.outputs.base-image-digest }}
            echo org.opencontainers.image.version=${{ steps.versions.outputs.node-version }}
            echo org.opencontainers.image.revision=${{ steps.ghd.outputs.sha }}
            echo EOF
          } >> "$GITHUB_OUTPUT"
        id: annotations
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        if: inputs.environment != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest-descriptor,index-descriptor
        with:
          images: ${{ env.IMAGES }}
          flavor: latest=${{ contains(inputs.docker-tags, 'latest') }}
          tags: ${{ env.TAGS }}
          annotations: ${{ steps.annotations.outputs.annotations }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        id: push
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: baseImage=${{ steps.versions.outputs.base-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name:     ${{ env.IMAGE_NAME }}
          subject-digest:   ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Prepare summary
        run: |
          {
            echo '## Image Info'
            echo '- This image: `${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}`'
            echo '- Base image: `${{ steps.versions.outputs.base-image }}@${{ steps.versions.outputs.base-image-digest }}`'
            echo '- Version: `${{ steps.versions.outputs.node-version }}`'
          } >> $GITHUB_STEP_SUMMARY
