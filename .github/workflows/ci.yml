name: DCC Node CI

on:
  pull_request:
  push:
    branches:
      # dev is kept as a pure fast-forward mirror of main (never diverges) -- triggering here too
      # made every merge fire this workflow TWICE for the identical commit (once per ref), racing
      # two "Test" check-runs against each other and making the surefire-report upload step fail
      # with "Found multiple in progress 'Test' checks for sha ..." even though every test passed.
      - main

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Container-aware heap (70% of cgroup limit), G1GC for compilation throughput.
# Java 25 defaults to ZGC (low-latency) which is suboptimal for batch sbt compilation.
# -XX:-UseZGC disables the implicit default before +UseG1GC to avoid
# "Multiple garbage collectors selected" JVM crash.
env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: ./.github/actions/install-dcc-native-deps
      - name: Compile
        run: sbt --batch compile

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # The actual test run (node-tests + lang-tests + friends) consistently completes right at the ~45min
    # mark (confirmed twice: "8893 tests run, 0 failed" both times), leaving no slack for the report/upload
    # steps that follow -- the job was getting killed by its own timeout mid-cleanup despite a clean pass.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: ./.github/actions/install-dcc-native-deps
        with:
          build-groth16-native: "true"
      - name: Run unit tests with coverage
        # lang-tests run WITHOUT coverage: scoverage instrumentation causes
        # BoxedUnit ClassCastException in the evaluator's function call runtime
        # (Scala 3 + scoverage interop issue with boxed unit returns).
        run: |
          set -euo pipefail
          sbt --batch \
            "lang-tests/test" \
            "lang-tests-js/test" \
            coverage \
            "repl/test" \
            "grpc-server/test" \
            "ride-runner/test" \
            "node-tests/testOnly -- -l com.decentralchain.tags.SlowTest" \
            coverageAggregate
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          files: target/scala-3/scoverage-report/scoverage.xml
          flags: node-scala
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: ScalableCapital/action-surefire-report@1e92f48016e566e4eed2d81560edbfe0f524cfb7  # v2.0.3
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          create_check: false
          check_name: 'Test'
      - name: Save debug data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          if-no-files-found: ignore
          name: test-debug-data
          retention-days: 7
          path: |
            gc.log*
            hs*.log
            core*

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: ./.github/actions/install-dcc-native-deps
      - name: Build tarballs
        run: sbt --batch buildTarballsForDocker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dcc-node-tarball
          retention-days: 7
          path: docker/target/dcc.tgz

  docker:
    name: Docker (${{ matrix.network }})
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        network: [mainnet, testnet, stagenet]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: ./.github/actions/install-dcc-native-deps
      - name: Build tarballs for docker
        run: sbt --batch buildTarballsForDocker
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        id: meta
        with:
          images: ghcr.io/decentral-america/node-scala
          tags: |
            type=sha
            type=raw,value=${{ matrix.network }}-latest
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ./docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan (Trivy) ──────────────────────────────────────────────────
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── OpenAPI contract/schema conformance ─────────────────────────────────────
  # Fails the PR if either OpenAPI spec (node REST API, ride-runner REST API)
  # changes in a way that breaks existing clients (oasdiff classifies each
  # schema/path change and this job gates on ERR-level findings only). Runs
  # standalone -- it just diffs file revisions -- so it has no `needs:` on
  # build/test/package and can report back well before those longer jobs finish.
  api-schema-conformance:
    name: OpenAPI Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract base-branch specs
        run: |
          git show "origin/${{ github.base_ref }}:node/src/main/resources/swagger-ui/openapi.yaml" > /tmp/node-openapi-base.yaml
          git show "origin/${{ github.base_ref }}:ride-runner/src/main/resources/swagger-ui/openapi.yaml" > /tmp/ride-runner-openapi-base.yaml

      - name: Install oasdiff
        # Installed via the project's official install script rather than a
        # hardcoded release-asset URL -- mirrors the matcher repo's
        # api-schema-conformance job (feat/tier5-oasdiff there). Verified live
        # against the current release (v1.26.0, 2026-07-24): oasdiff's Linux
        # tarballs are named oasdiff_<version>_<os>_<arch>.tar.gz (e.g.
        # oasdiff_1.26.0_linux_amd64.tar.gz) -- there is no unversioned
        # oasdiff_linux_amd64.tar.gz asset, so a bare
        # `releases/latest/download/oasdiff_linux_amd64.tar.gz` URL 404s.
        # install.sh resolves the correct per-platform asset name, verifies
        # its sha256 against the release's checksums.txt, and installs to
        # /usr/local/bin/oasdiff.
        #
        # Fetched from the v1.26.0 tag (not `main`) and `version=` pinned to
        # match, so both the installer logic and the oasdiff version it
        # installs are frozen -- a new oasdiff release can add new
        # breaking-change checks, and an unpinned install could make a PR
        # start failing this job for reasons unrelated to its own diff. Bump
        # both together, deliberately, and keep in sync with matcher's pin.
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/v1.26.0/install.sh | version=1.26.0 sh

      - name: Check node REST API for breaking changes
        # --fail-on ERR: exit 1 only on definite breaking changes (ERR),
        # not WARN-level maybes.
        run: oasdiff breaking /tmp/node-openapi-base.yaml node/src/main/resources/swagger-ui/openapi.yaml --fail-on ERR

      - name: Check ride-runner REST API for breaking changes
        run: oasdiff breaking /tmp/ride-runner-openapi-base.yaml ride-runner/src/main/resources/swagger-ui/openapi.yaml --fail-on ERR
