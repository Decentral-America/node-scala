name: DCC Node CI

on:
  pull_request:
  push:
    branches:
      # dev is kept as a pure fast-forward mirror of main (never diverges) -- triggering here too
      # made every merge fire this workflow TWICE for the identical commit (once per ref), racing
      # two "Test" check-runs against each other and making the surefire-report upload step fail
      # with "Found multiple in progress 'Test' checks for sha ..." even though every test passed.
      - main

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Container-aware heap (70% of cgroup limit), G1GC for compilation throughput.
# Java 25 defaults to ZGC (low-latency) which is suboptimal for batch sbt compilation.
# -XX:-UseZGC disables the implicit default before +UseG1GC to avoid
# "Multiple garbage collectors selected" JVM crash.
env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - name: Compile
        run: sbt --batch compile

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # The actual test run (node-tests + lang-tests + friends) consistently completes right at the ~45min
    # mark (confirmed twice: "8893 tests run, 0 failed" both times), leaving no slack for the report/upload
    # steps that follow -- the job was getting killed by its own timeout mid-cleanup despite a clean pass.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - name: Run unit tests with coverage
        # lang-tests run WITHOUT coverage: scoverage instrumentation causes
        # BoxedUnit ClassCastException in the evaluator's function call runtime
        # (Scala 3 + scoverage interop issue with boxed unit returns).
        run: |
          set -euo pipefail
          sbt --batch \
            "lang-tests/test" \
            "lang-tests-js/test" \
            coverage \
            "repl/test" \
            "grpc-server/test" \
            "ride-runner/test" \
            "node-tests/test" \
            coverageAggregate
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          files: target/scala-3/scoverage-report/scoverage.xml
          flags: node-scala
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: ScalableCapital/action-surefire-report@1e92f48016e566e4eed2d81560edbfe0f524cfb7  # v2.0.3
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          create_check: false
          check_name: 'Test'
      - name: Save debug data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          if-no-files-found: ignore
          name: test-debug-data
          retention-days: 7
          path: |
            gc.log*
            hs*.log
            core*

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          # ~/.sbt (the launcher boot dir) is deliberately NOT cached: a loose
          # restore-keys prefix match after an sbt.version bump mixed old and
          # new compiler-bridge jars in the same boot subdirectory, causing
          # sbt.internal.inc.InvalidComponent ("found: 2 files") on every
          # subsequent run sharing that cache generation, including reruns.
          # ~/.sbt/boot re-downloads are small and fast; not worth the risk.
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - name: Build tarballs
        run: sbt --batch buildTarballsForDocker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dcc-node-tarball
          retention-days: 7
          path: docker/target/dcc.tgz

  # One image per commit. A merge commit whose tree equals its merged branch head re-uses the image
  # already built (and smoke-tested, scanned, attested) for that head -- so the digest deployed from a
  # release tag and the digest main points at are the same bytes.
  docker-reuse:
    name: Docker (reuse check)
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc  # v0.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the image of an identical merged tree
        id: reuse
        env:
          IMAGE: ghcr.io/decentral-america/node-scala
        run: |
          set -euo pipefail
          reused=false
          if PARENT=$(git rev-parse -q --verify HEAD^2) && git diff --quiet "$PARENT" HEAD; then
            SRC="$IMAGE:sha-$(git rev-parse --short=7 "$PARENT")"
            if regctl manifest head "$SRC" >/dev/null 2>&1; then
              for tag in "sha-$(git rev-parse --short=7 HEAD)" mainnet-latest testnet-latest stagenet-latest; do
                regctl image copy "$SRC" "$IMAGE:$tag"
                echo "re-tagged $SRC -> $IMAGE:$tag"
              done
              reused=true
            fi
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker
    needs: docker-reuse
    if: needs.docker-reuse.outputs.reused != 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-node-scala.yml
    with:
      raw-docker-tags: |
        type=raw,value=mainnet-latest
        type=raw,value=testnet-latest
        type=raw,value=stagenet-latest

  # ── Security Scan (Trivy) ──────────────────────────────────────────────────
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── OpenAPI contract/schema conformance ─────────────────────────────────────
  # Fails the PR if either OpenAPI spec (node REST API, ride-runner REST API)
  # changes in a way that breaks existing clients (oasdiff classifies each
  # schema/path change and this job gates on ERR-level findings only). Runs
  # standalone -- it just diffs file revisions -- so it has no `needs:` on
  # build/test/package and can report back well before those longer jobs finish.
  api-schema-conformance:
    name: OpenAPI Breaking-Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract base-branch specs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:node/src/main/resources/swagger-ui/openapi.yaml" > /tmp/node-openapi-base.yaml
          git show "origin/${BASE_REF}:ride-runner/src/main/resources/swagger-ui/openapi.yaml" > /tmp/ride-runner-openapi-base.yaml

      - name: Install oasdiff (pinned release tarball, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tgz https://github.com/oasdiff/oasdiff/releases/download/v1.26.0/oasdiff_1.26.0_linux_amd64.tar.gz
          echo "06893108bdf5b7e310f39f0ce5aaff3151eae1ccade7ab457b16b16b6f95ae3e  /tmp/oasdiff.tgz" | sha256sum -c -
          sudo tar xzf /tmp/oasdiff.tgz -C /usr/local/bin oasdiff
          oasdiff --version

      - name: Check node REST API for breaking changes
        # --fail-on ERR: exit 1 only on definite breaking changes (ERR),
        # not WARN-level maybes.
        run: oasdiff breaking /tmp/node-openapi-base.yaml node/src/main/resources/swagger-ui/openapi.yaml --fail-on ERR

      - name: Check ride-runner REST API for breaking changes
        run: oasdiff breaking /tmp/ride-runner-openapi-base.yaml ride-runner/src/main/resources/swagger-ui/openapi.yaml --fail-on ERR
