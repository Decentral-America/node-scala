name: Publish snapshot JARs and dependency graph

on:
  push:
    branches:
      - main

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  update-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # required to submit dependency snapshot to GitHub
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          persist-credentials: false
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/sdk/protobuf-schemas
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@508b753e53cb6095967669e0911487d2b9bc9f41 # v1.1.22
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          set -euo pipefail
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-schemas && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
      - uses: scalacenter/sbt-dependency-submission@f43202114d7522a4b233e052f82c2eea8d658134 # v3.2.1
        with:
          configs-ignore: test compile-internal provided
  publish-snapshot:
    name: Publish Snapshots to Sonatype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          persist-credentials: false
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/sdk/protobuf-schemas
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.OSSRH_GPG_KEY }}
          gpg-passphrase: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@508b753e53cb6095967669e0911487d2b9bc9f41 # v1.1.22
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          set -euo pipefail
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-schemas && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
      - name: Publish snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGP_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Derive SNAPSHOT version: increment the patch segment of git.baseVersion.
          # Filter to the baseVersion line only so comment lines do not produce extra output.
          version=$(awk -F '[".]' '/baseVersion/{print $3"."$4"."$5+1; exit}' version.sbt)-SNAPSHOT
          # Skip publish if this SNAPSHOT version already exists in GitHub Packages.
          # Multiple pushes in the same minor version cycle produce identical SNAPSHOT
          # versions — only the first publish needs to succeed.
          #
          # NOTE: Maven packages are org-scoped in GitHub Packages, not repo-scoped.
          # The repo-level packages API always returns 404 for Maven; use the org endpoint.
          # Package names use groupId.artifactId dot notation (no slashes).
          existing=$(gh api "orgs/Decentral-America/packages/maven/io.decentralchain.lang/versions" \
            --jq '.[].name' 2>/dev/null || true)
          if echo "$existing" | grep -qF "$version"; then
            echo "::notice::$version already published to GitHub Packages — skipping"
            exit 0
          fi
          # Use sbt's `set` command to override the version setting for all subprojects.
          # -Dproject.version is a Java system property and does not affect sbt's version setting.
          sbt --batch "set ThisBuild / version := \"$version\"" publish
