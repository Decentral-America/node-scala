name: Publish snapshot JARs and dependency graph

on:
  push:
    branches:
      - main

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

jobs:
  update-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # required to submit dependency snapshot to GitHub
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/jvm/crypto
            packages/jvm/transactions
            packages/jvm/java-sdk
            packages/sdk/protobuf-serialization
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@4ed7b7ec4bfa2074fe48554c09e341267397247c  # v1.2.0
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-serialization && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/crypto                && mvn $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/transactions          && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/java-sdk              && ./mvnw $MVN_OPTS install)
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9  # v3.2.3
        with:
          configs-ignore: test compile-internal provided

  publish-snapshot:
    name: Publish Snapshots to Sonatype
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # required for OIDC signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/jvm/crypto
            packages/jvm/transactions
            packages/jvm/java-sdk
            packages/sdk/protobuf-serialization
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.OSSRH_GPG_KEY }}
          gpg-passphrase: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@4ed7b7ec4bfa2074fe48554c09e341267397247c  # v1.2.0
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-serialization && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/crypto                && mvn $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/transactions          && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/java-sdk              && ./mvnw $MVN_OPTS install)
      - name: Publish snapshots
        env:
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          PGP_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
        run: |
          version=$(awk -F '[".]' '{print $3"."$4"."$5+1}' version.sbt)-SNAPSHOT
          sbt -Dproject.version=$version --batch publish
