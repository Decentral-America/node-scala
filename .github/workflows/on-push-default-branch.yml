name: Publish snapshot JARs and dependency graph

on:
  push:
    branches:
      - main

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  update-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # required to submit dependency snapshot to GitHub
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          persist-credentials: false
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/jvm/crypto
            packages/jvm/transactions
            packages/jvm/java-sdk
            packages/sdk/protobuf-schemas
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          set -euo pipefail
          # Wagon retry flags: up to 3 retries on transient TLS/network failures
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-schemas && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/crypto                && mvn $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/transactions          && ./mvnw $MVN_OPTS install)
          LANG_VERSION=$(awk -F'"' '/baseVersion/{print $2}' version.sbt)
          sbt "set ThisBuild / version := \"$LANG_VERSION\"" lang/publishM2
          (cd _dcc-monorepo/packages/jvm/java-sdk              && ./mvnw $MVN_OPTS install)

  check-sonatype:
    name: Check Sonatype Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "$MAVEN_CENTRAL_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  publish-snapshot:
    name: Publish Snapshots to GitHub Packages
    needs: check-sonatype
    if: needs.check-sonatype.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # required to publish to GitHub Packages
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Decentral-America/DecentralChain
          path: _dcc-monorepo
          persist-credentials: false
          sparse-checkout: |
            packages/jvm/curve25519
            packages/jvm/blst
            packages/jvm/groth16
            packages/jvm/crypto
            packages/jvm/transactions
            packages/jvm/java-sdk
            packages/sdk/protobuf-schemas
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Install JVM dependencies from DecentralChain monorepo
        run: |
          set -euo pipefail
          # Wagon retry flags: up to 3 retries on transient TLS/network failures
          MVN_OPTS="--batch-mode --no-transfer-progress -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true"
          (cd _dcc-monorepo/packages/sdk/protobuf-schemas && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/curve25519            && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/blst                  && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/groth16               && ./mvnw $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/crypto                && mvn $MVN_OPTS install)
          (cd _dcc-monorepo/packages/jvm/transactions          && ./mvnw $MVN_OPTS install)
          LANG_VERSION=$(awk -F'"' '/baseVersion/{print $2}' version.sbt)
          sbt "set ThisBuild / version := \"$LANG_VERSION\"" lang/publishM2
          (cd _dcc-monorepo/packages/jvm/java-sdk              && ./mvnw $MVN_OPTS install)
      - name: Publish snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGP_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Derive SNAPSHOT version: increment the patch segment of git.baseVersion.
          # Filter to the baseVersion line only so comment lines do not produce extra output.
          version=$(awk -F '[".]' '/baseVersion/{print $3"."$4"."$5+1; exit}' version.sbt)-SNAPSHOT
          # Skip publish if this SNAPSHOT version already exists in GitHub Packages.
          # Multiple pushes in the same minor version cycle produce identical SNAPSHOT
          # versions — only the first publish needs to succeed.
          existing=$(gh api "repos/Decentral-America/node-scala/packages/maven/io.decentralchain%2Flang/versions" \
            --jq '.[].name' 2>/dev/null || true)
          if echo "$existing" | grep -qF "$version"; then
            echo "::notice::$version already published to GitHub Packages — skipping"
            exit 0
          fi
          # Use sbt's `set` command to override the version setting for all subprojects.
          # -Dproject.version is a Java system property and does not affect sbt's version setting.
          sbt --batch "set ThisBuild / version := \"$version\"" publish
