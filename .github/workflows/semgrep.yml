name: Semgrep SAST

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: '15 5 * * 1'  # Weekly on Monday at 05:15 UTC

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Scan (Scala)
    # Skip Dependabot-generated PRs — Semgrep cannot access the token in that context
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    # Run inside the official Semgrep container (pinned to a specific release).
    # semgrep/semgrep-action is DEPRECATED (archived April 2024); use container directly.
    container:
      image: semgrep/semgrep:1.164.0@sha256:5ac65e5366465438a5408699584c605b77f125908adaa5620d8c3e56cfa36e5b

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run Semgrep SAST scan
        # --config auto  : auto-detects language and selects appropriate rule sets
        #                  (includes p/scala for Scala source files)
        # exit code 0    : no findings
        # exit code 1    : findings present (not a crash); SARIF upload still runs
        # exit code >1   : semgrep itself failed; propagate as error
        #
        # Excluded paths:
        #   node/src/main/resources/swagger-ui/
        #     Vendored third-party Webpack bundles from the swagger-ui distribution.
        #     SAST rules fire false positives on minified module-registry patterns
        #     (e.g. prototype-pollution-loop) that are not present in our source.
        #     These files are served as-is; security lies in keeping the swagger-ui
        #     dependency version current (managed by Renovate in the node/build.sbt).
        run: |
          set +e
          semgrep scan --config auto --sarif --output semgrep.sarif \
            --exclude 'node/src/main/resources/swagger-ui' \
            .
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::Semgrep failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        if: always()
        with:
          sarif_file: semgrep.sarif
