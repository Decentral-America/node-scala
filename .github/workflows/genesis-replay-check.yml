name: Genesis replay regression check

# Why this exists: a real consensus-safety fix (committed-generators-hash exclusion) was built,
# tested, and even deployed to production at one point, then silently disappeared from dev/main
# for weeks after a history rewrite -- discovered only by accident on 2026-08-06, when a fresh
# node was found to be permanently unable to bootstrap from genesis on live testnet
# (InvalidStateHash at height 1798). No test anywhere exercised a full fresh-genesis P2P replay,
# so the regression went completely undetected. This workflow is that missing test: it builds
# the current branch, syncs a brand-new node from genesis against the live testnet chain, and
# fails loudly if it ever gets stuck with InvalidStateHash before a known-good height.
#
# The replay target is the live tip minus 200 blocks, never below 56500, so every divergence ever found
# on this chain (1798/1799, 2640, 3325, the 56355 penalty proof) is inside the replayed range. The replay
# also counts block signatures that verify only under the legacy BLS DST (audit AUD-040).

on:
  schedule:
    - cron: '17 4 * * 1'  # weekly, Monday 04:17 UTC -- a live-network check, not a unit test
  workflow_dispatch:
    inputs:
      min-height:
        description: 'Height the fresh replay must reach (empty = live tip - 200, never below 56500)'
        required: false
        default: ''
      timeout-minutes:
        description: 'Minutes to wait for the replay to reach min-height'
        required: false
        default: '150'

permissions:
  contents: read

concurrency:
  group: genesis-replay-check
  cancel-in-progress: true

jobs:
  replay:
    name: Fresh-genesis replay vs live testnet
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1

      - name: Build node tarball from pinned Maven Central native deps
        run: sbt --batch verifyDccArtifacts buildTarballsForDocker

      - name: Resolve the replay target
        id: target
        env:
          MIN_HEIGHT_INPUT: ${{ inputs.min-height }}
        run: |
          set -euo pipefail
          TIP=$(curl -fsS --max-time 15 https://testnet-node.decentralchain.io/blocks/height | jq -r .height)
          TARGET="${MIN_HEIGHT_INPUT:-$((TIP - 200))}"
          if [ "$TARGET" -lt 56500 ]; then TARGET=56500; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Live tip $TIP; replay target $TARGET" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare a fresh-genesis testnet config (miner disabled, no self-collision)
        run: |
          set -euo pipefail
          mkdir -p /tmp/replay-scratch
          curl -sf -o /tmp/replay-scratch/dcc.conf https://raw.githubusercontent.com/Decentral-America/infra/main/node-config/testnet/dcc.conf
          PEER_IP=$(getent hosts testnet-node.decentralchain.io | awk '{print $1; exit}')
          test -n "$PEER_IP" || { echo "::error::could not resolve testnet-node.decentralchain.io"; exit 1; }
          echo "Replay peer: $PEER_IP:6868"
          PEER_IP="$PEER_IP" python3 - <<'PYEOF'
          import os, re
          p = "/tmp/replay-scratch/dcc.conf"
          s = open(p).read()
          peer = os.environ["PEER_IP"] + ":6868"
          for pattern, repl in [
              (r'declared-address = "[^"]*"', 'declared-address = "127.0.0.1:16868"'),
              (r'known-peers = \[[^\]]*\]', f'known-peers = ["{peer}"]'),
              (r'miner \{\n(\s*)enable = yes', r'miner {\n\1enable = false'),
          ]:
              s, n = re.subn(pattern, repl, s, count=1)
              assert n == 1, f"dcc.conf drifted: no match for {pattern!r}"
          open(p, "w").write(s)
          PYEOF
          printf '\ndcc.wallet.seed = "4uQeVj5tqViQh7yWWGStvkEG1Zmhx6uxUx"\ndcc.wallet.password = "ci-scratch-only"\ndcc.rest-api.bind-address = "0.0.0.0"\n' >> /tmp/replay-scratch/dcc.conf

      - name: Extract build
        run: |
          mkdir -p /tmp/replay-run
          tar xzf docker/target/dcc.tgz -C /tmp/replay-run
          NODE_BIN=$(find /tmp/replay-run -maxdepth 3 -name node -path '*/bin/*')
          if [ -z "$NODE_BIN" ]; then
            echo "::error::Could not locate the node launcher script under /tmp/replay-run"
            find /tmp/replay-run -maxdepth 3
            exit 1
          fi
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"

      - name: Run fresh-genesis replay and watch for InvalidStateHash
        env:
          MIN_HEIGHT: ${{ steps.target.outputs.target }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes || '150' }}
        run: |
          set -euo pipefail
          "$NODE_BIN" /tmp/replay-scratch/dcc.conf > /tmp/replay.log 2>&1 &
          NODE_PID=$!
          trap 'kill $NODE_PID 2>/dev/null || true' EXIT
          START=$SECONDS
          DEADLINE=$((SECONDS + TIMEOUT_MINUTES * 60))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            HEIGHT=$(curl -s --max-time 5 http://localhost:6869/blocks/height 2>/dev/null | grep -o '[0-9]*' || echo 0)
            if [ "${HEIGHT:-0}" -ge "$MIN_HEIGHT" ]; then
              echo "Reached height $HEIGHT (>= $MIN_HEIGHT) in $(( (SECONDS - START) / 60 )) min." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if grep -q "InvalidStateHash" /tmp/replay.log; then
              echo "::error::Fresh-genesis replay hit InvalidStateHash before height $MIN_HEIGHT (last applied: ${HEIGHT:-0}) -- consensus-hash regression."
              grep -B2 -A2 "InvalidStateHash" /tmp/replay.log | head -60
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out after $TIMEOUT_MINUTES min at height ${HEIGHT:-0} (< $MIN_HEIGHT)."
          tail -100 /tmp/replay.log
          exit 1

      - name: Count legacy BLS DST acceptances (AUD-040)
        if: always()
        run: |
          {
            echo '### Signatures accepted only under the legacy BLS DST during this replay'
            echo '| context | count |'
            echo '|---|---|'
            for c in pop endorsement endorsement-aggregate hotstuff-vote; do
              echo "| $c | $(grep -cE "LEGACY_BLS_DST_ACCEPTED context=${c}( |$)" /tmp/replay.log || true) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: genesis-replay-log
          path: /tmp/replay.log
          retention-days: 14
