name: Check PR

on:
  pull_request:

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    name: Check PR
    runs-on: ubuntu-latest
    outputs:
      lang-changed: ${{ steps.filter.outputs.lang == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
          # GPG keys are NOT needed for scalafmt/compile checks.
          # Only publish-snapshots (below) requires GPG.
      - uses: sbt/setup-sbt@93e926cbdb4a428e41b4ef754124ec82925ffdc2  # v1.1.23
      - name: Check PR
        run: sbt -J-Xlog:gc*=debug:file=./gc.log --batch checkPR
      - uses: scacap/action-surefire-report@5609ce4db72c09db044803b344a8968fd1f315da
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          create_check: false
          check_name: 'Check PR'
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            lang:
              - 'lang/**'
              - 'build.sbt'
              - 'project/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dcc-fat-jar
          path: node/target/waves-all-*.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.filter.outputs.lang == 'true'
        with:
          name: file-compiler
          path: lang/jvm/target/file-compiler.jar
      - name: Save debug data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          if-no-files-found: ignore
          name: debug-data
          path: |
            gc.log*
            hs*.log
            core*

  run-smoke-tests:
    needs: check-pr
    name: Run Smoke Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dcc-fat-jar
      - run: java -cp '*' com.decentralchain.utils.UtilApp smoke

  run-integration-tests:
    name: Run integration tests
    needs: check-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
      - uses: sbt/setup-sbt@93e926cbdb4a428e41b4ef754124ec82925ffdc2  # v1.1.23
      - name: Run Integration Tests
        run: sbt --batch "node-it/docker;node-it/test"
        env:
          RUN_ID: ${{ github.head_ref }}-${{ github.run_number }}-${{ github.run_attempt }}
      - uses: scacap/action-surefire-report@5609ce4db72c09db044803b344a8968fd1f315da
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          create_check: false
          check_name: 'Run integration tests'
      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          if-no-files-found: ignore
          name: test-logs
          path: |
            node-it/target/logs/*/

  publish-snapshots:
    name: Publish snapshot packages
    needs: check-pr
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'publish-snapshots')
    permissions:
      contents: read
      id-token: write  # required for OIDC signing
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.OSSRH_GPG_KEY }}
          gpg-passphrase: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@93e926cbdb4a428e41b4ef754124ec82925ffdc2  # v1.1.23
      - run: sbt -Dproject.version=$(awk -F '[".]' '{print $3"."$4"."$5+1}' version.sbt)-$PR_NUMBER-SNAPSHOT --batch publish
        env:
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          PGP_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
