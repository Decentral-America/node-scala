name: Check PR

on:
  pull_request:

# Minimal permissions at workflow level; jobs that need more declare explicitly.
permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:-UseZGC -XX:+UseG1GC -Xss4m -XX:MaxMetaspaceSize=1g"

jobs:
  check-pr:
    name: Check PR
    runs-on: ubuntu-latest
    # `sbt checkPR` (compile + unit tests + -Werror) now takes ~25-30 min; the parallel "DCC Node
    # CI / Test" job ran 28-32 min on main in Sep 2026. Without an explicit cap this job inherits
    # GitHub's 360-min default, so a hung runner (observed: sbt checkPR wedged for ~1h48m with no
    # progress) silently burns up to 6h of minutes before failing. 45 min is ~1.5x the normal runtime:
    # headroom for a slow runner, but it still fails fast on a genuine hang. (The old 30-min cap
    # dated from a ~15 min suite and started cancelling healthy runs at 30m.)
    timeout-minutes: 45
    # action-surefire-report updates this job's own check-run with test annotations; needs checks:write
    # (workflow-level permissions are read-only) or it fails the job with "Resource not accessible by
    # integration" even when the actual sbt build/tests pass.
    permissions:
      contents: read
      checks: write
    outputs:
      lang-changed: ${{ steps.filter.outputs.lang == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          # GPG keys are NOT needed for scalafmt/compile checks.
          # Only publish-snapshots (below) requires GPG.
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Check PR
        # gc.log* capture is on top of the workflow-level JAVA_TOOL_OPTIONS so a hung/slow sbt JVM
        # (see the 30-min timeout note above -- the ~1h48m wedge that motivated it) leaves a GC log
        # behind for the "Save debug data" step to pick up on the next real occurrence, instead of
        # having to guess at the starved resource after the fact.
        env:
          JAVA_TOOL_OPTIONS: "${{ env.JAVA_TOOL_OPTIONS }} -Xlog:gc*:file=gc.log:time,uptime,level,tags"
        run: sbt --batch checkPR
      - uses: ScalableCapital/action-surefire-report@1e92f48016e566e4eed2d81560edbfe0f524cfb7  # v2.0.3
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          create_check: false
          check_name: 'Check PR'
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            lang:
              - 'lang/**'
              - 'build.sbt'
              - 'project/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dcc-node-tarball
          path: docker/target/dcc.tgz
          retention-days: 1
      - name: Save debug data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        # Only on failure: gc.log now generated on every run (see the "Check PR" step's
        # JAVA_TOOL_OPTIONS), so uploading unconditionally would burn storage on every green PR.
        # Matches the node-it.yml precedent for its own debug-artifact step.
        if: failure()
        with:
          if-no-files-found: ignore
          name: debug-data
          path: |
            gc.log*
            hs*.log
            core*
            **/target/test-reports/*.xml
          retention-days: 14

  run-smoke-tests:
    needs: check-pr
    name: Run Smoke Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dcc-node-tarball
      - name: Smoke test
        run: |
          mkdir -p dcc-node
          tar xzf dcc.tgz -C dcc-node --strip-components=1
          java -cp 'dcc-node/lib/*' com.decentralchain.utils.UtilApp smoke

  # node-it integration tests are NOT run on every PR. Reasons:
  #   1. They never actually gated anything here -- `sbt node-it/docker;node-it/test` runs the full
  #      ~148-suite Docker integration set on a single runner, which does not finish inside any sane
  #      cap (observed: only 57 suites completed in 60 min before the timeout killed the job), so this
  #      job timed out and reported red on EVERY PR regardless of the diff. A gate that is always red
  #      gates nothing; it only burned ~60 runner-min per PR.
  #   2. node-it is the heaviest thing in this repo (Docker-per-suite). Running it per-PR is the single
  #      biggest CI-minute sink; it belongs on deliberate triggers, not every push to a PR branch.
  #   3. The intended path already exists: node-it.yml (workflow_dispatch) runs a chosen suite subset
  #      (defaults to com.decentralchain.it.sync.finalization.*) -- "dispatch it for consensus changes".
  #
  # So integration validation is on-demand via node-it.yml, not this PR gate. If a per-commit signal is
  # wanted later, add a sharded node-it matrix (see matcher's ci.yml integration-dex-it: discover via
  # `show node-it/Test/definedTestNames`, partition by `index mod SHARD_COUNT`) gated on push-to-main,
  # NOT on pull_request -- keep the expensive Docker suites off the per-PR path.

  publish-snapshots:
    name: Publish snapshot packages
    needs: check-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(github.event.pull_request.labels.*.name, 'publish-snapshots')
    permissions:
      contents: read
      id-token: write  # required for OIDC signing
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b  # v1.2.1
      - name: Publish PR snapshot
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          V="$(awk -F '[".]' '/git.baseVersion/{print $3"."$4"."$5+1; exit}' version.sbt)-${PR_NUMBER}-SNAPSHOT"
          sbt --batch "set ThisBuild / version := \"$V\"" publish
