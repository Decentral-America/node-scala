<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DecentralChain Node API</title>
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.59.0"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/api-docs/openapi.yaml',
        theme: 'kepler',
        darkMode: true,
        layout: 'modern',
        defaultHttpClient: {
          targetKey: 'shell',
          clientKey: 'curl',
        },
        hideModels: false,
        hiddenClients: [],
      })
    </script>
  </body>
</html>
